<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股高低點訊號與選股回測</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1b1f27; --sub:#5b6472; --line:#e3e6eb;
  --blue:#2563eb; --gray:#6b7280; --amber:#d97706; --bot:#2563eb; --top:#ea580c;
  --up:#d9363e; --down:#15803d; --chip:#eef1f6; --warn-bg:#fff4e0; --warn-ink:#7a4a00; --warn-line:#f0c987;
  --ok-bg:#e7f6ec; --ok-ink:#14532d; --bad-bg:#fdecec; --bad-ink:#7f1d1d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#171b23; --ink:#e8ebf0; --sub:#9aa3b2; --line:#2a303b;
    --blue:#6ea0ff; --gray:#98a1b0; --amber:#f0a73a; --bot:#6ea0ff; --top:#ff8a4d;
    --up:#ff6b6b; --down:#4ade80; --chip:#232936; --warn-bg:#2d2412; --warn-ink:#f3cf8a; --warn-line:#5a4720;
    --ok-bg:#12301f; --ok-ink:#a7f0c0; --bad-bg:#3a1717; --bad-ink:#ffb4b4;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}
header{padding:22px 0 10px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em}
.meta{color:var(--sub);font-size:13px}
.demo{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 -16px 12px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--blue);border-color:var(--blue);color:#fff}
section.tab{display:none}
section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 6px;color:var(--sub);font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:15px}
.b-neutral{background:var(--chip);color:var(--ink)}
.b-bottom{background:color-mix(in srgb,var(--bot) 18%,transparent);color:var(--bot)}
.b-top{background:color-mix(in srgb,var(--top) 18%,transparent);color:var(--top)}
.b-mixed{background:var(--warn-bg);color:var(--warn-ink)}
.meter{display:flex;gap:4px;margin:6px 0 2px}
.meter i{flex:1;height:8px;border-radius:4px;background:var(--chip)}
.meter.bot i.on{background:var(--bot)} .meter.top i.on{background:var(--top)}
.flags{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.flags li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;color:var(--sub)}
.flags li.on{color:var(--ink);font-weight:600}
.dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line)}
.flags.bot li.on .dot{background:var(--bot)} .flags.top li.on .dot{background:var(--top)}
.kpi .v{font-size:24px;font-weight:700;line-height:1.2}
.kpi .l{font-size:12.5px;color:var(--sub)}
.kpi .s{font-size:12.5px;color:var(--sub);margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600;font-size:12.5px}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.base td{color:var(--sub);font-style:italic}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--chip)}
.t-buy{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.t-hold{background:var(--chip);color:var(--sub)}
.t-sell{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down)}
.t-avoid{background:var(--chip);color:var(--sub)}
.verdict{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12.5px;font-weight:600;margin-left:6px}
.v-ok{background:var(--ok-bg);color:var(--ok-ink)} .v-bad{background:var(--bad-bg);color:var(--bad-ink)} .v-mid{background:var(--chip);color:var(--sub)}
.note{font-size:13px;color:var(--sub)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 6px 6px 0}
.seg button{border:0;background:var(--card);color:var(--sub);padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.chartbox{position:relative;width:100%}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--sub);margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.14);z-index:3;white-space:nowrap;display:none}
.tip b{display:block;margin-bottom:2px}
.tip em{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
details{margin:8px 0}
summary{cursor:pointer;color:var(--blue);font-size:14px}
.prose p{margin:6px 0} .prose h3{color:var(--ink);font-size:15px;margin:16px 0 4px}
.prose ul{margin:4px 0 4px 18px;padding:0} .prose li{margin:3px 0}
.err{color:var(--bad-ink);background:var(--bad-bg)}
footer{color:var(--sub);font-size:12.5px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1 style="display:flex;align-items:center;gap:10px"><img src="icon.svg" alt="" width="34" height="34" style="border-radius:8px">台股高低點訊號 × 個股選股回測</h1>
    <div class="meta" id="meta"></div>
    <div id="banner"></div>
  </header>
  <nav id="nav">
    <button data-t="overview" class="on">總覽</button>
    <button data-t="market">大盤訊號</button>
    <button data-t="stocks">十股建議</button>
    <button data-t="perf">回測績效</button>
    <button data-t="method">方法與風險</button>
  </nav>
  <section class="tab on" id="tab-overview"></section>
  <section class="tab" id="tab-market"></section>
  <section class="tab" id="tab-stocks"></section>
  <section class="tab" id="tab-perf"></section>
  <section class="tab" id="tab-method"></section>
  <footer>歷史回測不代表未來績效；本頁內容僅為量化研究與教學用途，不構成任何投資建議。投資有風險，請自行評估並承擔結果。</footer>
</div>

<script src="data/result.js"></script>
<script>
(function(){
"use strict";
const R = window.RESULT;
const app = document.getElementById('app');
if(!R){
  document.getElementById('meta').innerHTML = '<div class="card err">找不到 data/result.js。請先執行 <code>python run_all.py</code> 產生資料。</div>';
  return;
}
const M = R.meta, MK = R.market, ST = R.stocks;
const nz = v => v !== null && v !== undefined && !Number.isNaN(v);
const pct = (v,d=1,sign=false) => nz(v) ? ((sign&&v>0?'+':'')+(v*100).toFixed(d)+'%') : '—';
const num = (v,d=2) => nz(v) ? v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}) : '—';
const cls = v => !nz(v) ? '' : (v>0 ? 'up' : (v<0 ? 'down' : ''));
const retCell = (v,d=1) => `<span class="${cls(v)}">${pct(v,d,true)}</span>`;
const $ = (s, el=document) => el.querySelector(s);

/* ---------- header ---------- */
$('#meta').textContent = `資料截止 ${M.data_through} ・ 回測 ${M.backtest_start} ~ ${M.data_through}（樣本外自 ${M.oos_start}）・ 產生於 ${M.generated_at}`;
const notes = [];
if(M.demo) notes.push('<b>⚠ 這是 DEMO 示範資料（電腦合成，不是真實行情）。</b>所有數字、訊號與選股清單都沒有意義，只用來展示介面。請在 GitHub 執行 <code>python run_all.py</code> 或啟用 Actions，換成真實資料。');
if(!M.finmind_margin) notes.push('融資維持率資料未取得，大盤訊號只使用價量指標（5 項計分）。');
if(!M.finmind_revenue) notes.push('月營收資料未取得，個股選股未使用營收因子。');
$('#banner').innerHTML = notes.map(t=>`<div class="demo">${t}</div>`).join('');

/* ---------- tabs ---------- */
const tabs = ['overview','market','stocks','perf','method'];
const rendered = {};
function show(t){
  if(!tabs.includes(t)) t='overview';
  tabs.forEach(x=>{ $('#tab-'+x).classList.toggle('on', x===t); });
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  if(!rendered[t]){ renderers[t](); rendered[t]=true; }
  else if(redraw[t]) redraw[t]();
  history.replaceState(null,'','#'+t);
  window.scrollTo({top:0});
}
document.getElementById('nav').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.t); });

/* ---------- chart engine (inline SVG, no dependencies) ---------- */
function niceTicks(lo,hi,n){
  const raw=(hi-lo)/n; if(!(raw>0)) return [lo];
  const p=Math.pow(10,Math.floor(Math.log10(raw))); const r=raw/p;
  const step=(r<1.5?1:r<3?2:r<7?5:10)*p;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(10));
  return out;
}
function logTicks(lo,hi){
  const out=[]; const k0=Math.floor(Math.log10(lo)), k1=Math.ceil(Math.log10(hi));
  for(let k=k0;k<=k1;k++) for(const m of [1,2,5]){ const v=m*Math.pow(10,k); if(v>=lo*0.999&&v<=hi*1.001) out.push(v); }
  return out;
}
function chart(host, o){
  host.innerHTML='';
  const W = Math.max(host.clientWidth||700, 280), H = o.height || (W<520?230:300);
  const m={l:o.left||50,r:10,t:8,b:22}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const D=o.dates, n=D.length, i0=Math.min(o.from||0, n-2);
  let lo=Infinity, hi=-Infinity;
  o.series.forEach(s=>{ for(let i=i0;i<n;i++){ const v=s.values[i]; if(nz(v)&&(!o.log||v>0)){ lo=Math.min(lo,v); hi=Math.max(hi,v);} } });
  if(!isFinite(lo)){ host.textContent='無資料'; return; }
  if(o.maxZero) hi=0;
  const f=o.log?Math.log:(x=>x);
  let a=f(lo), b=f(hi); const pad=(b-a)*0.06||0.5; a-=pad; if(!o.maxZero) b+=pad;
  const X=i=>m.l+(i-i0)/Math.max(n-1-i0,1)*iw, Y=v=>m.t+(1-(f(v)-a)/(b-a))*ih;
  const yf=o.yFmt||(v=>num(v,0));
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  const ticks=o.log?logTicks(lo,hi):niceTicks(o.maxZero?lo:lo,hi,5);
  ticks.forEach(t=>{ const y=Y(t); if(y<m.t-1||y>m.t+ih+1) return;
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)"/>`;
    s+=`<text x="${m.l-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--sub)">${yf(t)}</text>`; });
  // x labels: first index of each year
  const yrs=[]; for(let i=i0;i<n;i++){ if(i===i0||D[i].slice(0,4)!==D[i-1].slice(0,4)) yrs.push(i); }
  const every=Math.ceil(yrs.length/(W<520?4:9));
  yrs.forEach((i,k)=>{ if(k%every) return; const x=X(i);
    s+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${m.t+ih}" y2="${m.t+ih+4}" style="stroke:var(--line)"/>`;
    s+=`<text x="${x.toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="11" style="fill:var(--sub)">${D[i].slice(0,4)}</text>`; });
  if(o.zeroLine && lo<0 && hi>0){ const y=Y(0); s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" style="stroke:var(--sub)" stroke-dasharray="3 3"/>`; }
  o.series.forEach(se=>{
    let d='', pen=false;
    for(let i=i0;i<n;i++){ const v=se.values[i]; if(!nz(v)||(o.log&&v<=0)){pen=false;continue;}
      d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); pen=true; }
    if(se.fill){ const y0=Y(Math.min(0,hi)); s+=`<path d="${d} L${X(n-1).toFixed(1)} ${y0.toFixed(1)} L${X(i0).toFixed(1)} ${y0.toFixed(1)}Z" style="fill:${se.color};opacity:.18"/>`; }
    s+=`<path d="${d}" fill="none" stroke-linejoin="round" style="stroke:${se.color};stroke-width:${se.width||1.6}" ${se.dash?`stroke-dasharray="${se.dash}"`:''}/>`;
  });
  const dmap=new Map(); D.forEach((d,i)=>dmap.set(d,i));
  (o.markers||[]).forEach(mk=>{ const i=dmap.get(mk.date); if(i===undefined||i<i0) return; const v=o.series[0].values[i]; if(!nz(v)) return;
    const x=X(i), y=Y(v), up=mk.shape==='up', dy=up?9:-9, sz=5.5;
    const pts=up?`${x},${y+dy-sz} ${x-sz},${y+dy+sz} ${x+sz},${y+dy+sz}`:`${x},${y+dy+sz} ${x-sz},${y+dy-sz} ${x+sz},${y+dy-sz}`;
    s+=`<polygon points="${pts}" style="fill:${mk.color};opacity:.9"/>`; });
  s+=`<line id="cx" y1="${m.t}" y2="${m.t+ih}" style="stroke:var(--sub);display:none" stroke-dasharray="2 3"/>`;
  s+=`<rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const legend=o.legend===false?'':`<div class="legend">${o.series.filter(x=>x.name).map(x=>`<span><i style="background:${x.color}"></i>${x.name}</span>`).join('')}${(o.legendExtra||'')}</div>`;
  host.insertAdjacentHTML('beforeend', legend+`<div class="chartbox">${s}<div class="tip"></div></div>`);
  const box=$('.chartbox',host), svg=$('svg',box), tip=$('.tip',box), cx=$('#cx',svg), hit=$('#hit',svg);
  const evByDate=o.eventsByDate||{};
  function move(ev){
    const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*(W/r.width);
    let i=Math.round(i0+(px-m.l)/iw*(n-1-i0)); i=Math.max(i0,Math.min(n-1,i));
    const x=X(i); cx.setAttribute('x1',x); cx.setAttribute('x2',x); cx.style.display='';
    let h=`<b>${D[i]}</b>`;
    o.series.forEach(se=>{ if(se.name && nz(se.values[i])) h+=`<div><em style="background:${se.color}"></em>${se.name}：${(se.tipFmt||yf)(se.values[i])}</div>`; });
    if(evByDate[D[i]]) h+=`<div style="margin-top:3px">${evByDate[D[i]]}</div>`;
    tip.innerHTML=h; tip.style.display='block';
    const tw=tip.offsetWidth; let left=(x/W)*r.width+12; if(left+tw>r.width-4) left=(x/W)*r.width-tw-12;
    tip.style.left=Math.max(left,2)+'px'; tip.style.top='6px';
  }
  hit.addEventListener('pointermove',move); hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{ cx.style.display='none'; tip.style.display='none'; });
}
function fromIndex(dates, years){ if(!years) return 0; const end=new Date(dates[dates.length-1]); end.setFullYear(end.getFullYear()-years);
  const iso=end.toISOString().slice(0,10); let i=dates.findIndex(d=>d>=iso); return i<0?0:i; }
function segButtons(host, items, cur, onPick){
  host.innerHTML=items.map(([k,l])=>`<button data-k="${k}" class="${String(k)===String(cur)?'on':''}">${l}</button>`).join('');
  host.classList.add('seg');
  host.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; host.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); onPick(b.dataset.k); };
}
function table(head, rows, opt={}){
  const LEFT=['股票','類型','說明','持股','新買進','賣出'];
  return `<div class="tablewrap"><table><thead><tr>${head.map((h,i)=>`<th class="${(i===0||LEFT.includes(h))?'l':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

/* ---------- 歷史驗證文字 ---------- */
function evidence(kind, thr, seg, h){
  const s=MK.stats[kind][thr][seg][h], b=MK.stats.baseline[seg][h][kind];
  if(!s||!s.n) return null;
  let v='mid', label='與隨機進場相近';
  const dm = s.mean-b.mean, dw = s.win-b.win;
  if(kind==='bottom'){ if(dm>0.005 && dw>0.03){v='ok';label='優於隨機進場';} else if(dm<-0.005 && dw<0){v='bad';label='未優於隨機進場';} }
  else { if(dm<-0.005 && dw>0.03){v='ok';label='有預警效果';} else if(dm>0.005 && dw<0){v='bad';label='沒有預警效果';} }
  return {s,b,v,label,few:s.n<20};
}

/* ---------- 總覽 ---------- */
function renderOverview(){
  const st=MK.state, el=$('#tab-overview');
  const names={neutral:'中性（無明確反轉訊號）',bottom:'底部警示',top:'高點警示',mixed:'多空訊號並存'};
  const meter=(k,max,cl)=>`<div class="meter ${cl}">${Array.from({length:max},(_,i)=>`<i class="${i<k?'on':''}"></i>`).join('')}</div>`;
  const flags=(arr,cl)=>`<ul class="flags ${cl}">${arr.map(f=>`<li class="${f.on?'on':''}"><span class="dot"></span><span>${f.label}</span></li>`).join('')}</ul>`;
  const advice={neutral:'目前沒有達到門檻的反轉訊號，不宜用大盤訊號做重大加減碼；可依「十股建議」的規則定期檢視。',
    bottom:'多項超賣／恐慌指標同時出現。歷史上這類情境常是中期布局區，但仍可能續跌——建議分批而非一次投入。',
    top:'多項過熱指標同時出現。歷史上這類情境常是風險升高區，可考慮分批減碼或收緊停利，而不是全數賣出。',
    mixed:'短期內同時出現多空訊號，通常代表劇烈震盪，訊號可信度較低。'}[st.status];
  const ev=(kind)=>{ const e=evidence(kind,String(st.threshold),'all','60'); if(!e) return '<span class="note">樣本不足</span>';
    const word=kind==='bottom'?'上漲':'下跌';
    return `共 <b>${e.s.n}</b> 次，之後 60 個交易日<b>${word}</b>的比率 <b>${pct(e.s.win,0)}</b>（隨機一天進場：${pct(e.b.win,0)}），平均報酬 ${retCell(e.s.mean)}（隨機：${retCell(e.b.mean)}）<span class="verdict v-${e.v}">${e.label}</span>${e.few?'<span class="verdict v-mid">樣本偏少</span>':''}`; };
  const sm=ST.metrics, f=sm.strategy.full, bm=sm.benchmark.full, fo=sm.strategy.oos, bo=sm.benchmark.oos;
  el.innerHTML=`
  <div class="card">
    <h2>大盤目前狀態（加權指數 ${num(st.close,0)}，${st.date}）</h2>
    <div style="margin:4px 0 10px"><span class="badge b-${st.status}">${names[st.status]}</span></div>
    <p style="margin:0 0 10px">${advice}</p>
    <div class="grid g2">

/* ---------- 十股表格 ---------- */
function picksTable(list, compact){
  if(!list.length) return '<p class="note">目前無符合條件的標的。</p>';
  const tag=a=>`<span class="tag ${a==='買進'?'t-buy':a==='續抱'?'t-hold':a==='賣出'?'t-sell':'t-avoid'}">${a}</span>`;
  if(compact){
    return table(['#','股票','動作','收盤','分數','12-1月動能','距200日線'], list.map((r,i)=>`<tr><td>${r.rank||i+1}</td><td class="l">${r.code} ${r.name}</td><td>${tag(r.action)}</td><td>${num(r.close)}</td><td>${num(r.score,1)}</td><td>${retCell(r.mom12)}</td><td>${retCell(r.bias200)}</td></tr>`));
  }
  return table(['#','股票','動作','收盤','分數','12-1月動能','6-1月動能','營收年增(3M)','殖利率','年化波動','距200日線','說明'],
    list.map((r,i)=>`<tr><td>${r.rank||i+1}</td><td class="l">${r.code} ${r.name}</td><td>${tag(r.action)}</td><td>${num(r.close)}</td><td>${num(r.score,1)}</td><td>${retCell(r.mom12)}</td><td>${retCell(r.mom6)}</td><td>${nz(r.rev)?retCell(r.rev):'—'}</td><td>${pct(r.dy)}</td><td>${pct(r.vol,0)}</td><td>${retCell(r.bias200)}</td><td class="l">${r.reason||''}</td></tr>`));
}

function drawMarketCharts(){

    markers.push({date:e.date,shape:e.type==='bottom'?'up':'down',color:e.type==='bottom'?'var(--bot)':'var(--top)'}); });
  chart($('#mk-chart'),{dates:c.dates,from:i0,log:true,markers,eventsByDate:byDate,left:56,

function drawStats(){
  const thr=mkState.thr, seg=mkState.seg, S=MK.stats;
  const hs=M.params.horizons;
  const mk=(kind,title)=>{
    const rows=hs.map(h=>{ const s=S[kind][thr][seg][h], b=S.baseline[seg][h][kind];
      return `<tr><td>${h} 日</td><td>${s.n}</td><td>${nz(s.win)?pct(s.win,0):'—'}</td><td>${retCell(s.mean)}</td><td>${retCell(s.median)}</td><td style="color:var(--sub)">${pct(b.win,0)}</td><td style="color:var(--sub)">${retCell(b.mean)}</td></tr>`; });
    return `<h3>${title}　<span class="note">（事件數：${S[kind][thr][seg].count}）</span></h3>`+table(['持有期間','樣本數','勝率','平均報酬','中位數','基準勝率','基準平均'],rows);
  };
  $('#mk-stats').innerHTML=mk('bottom','▲ 底部警示後（勝率＝之後上漲）')+mk('top','▼ 高點警示後（勝率＝之後下跌）')+

}

  $('#tab-method').innerHTML=`<div class="card prose">

  <p>底部：RSI 超賣、跌深（低於 200 日線 8%）、距一年高點回落 15%、KD 低檔、跌破布林下軌、融資維持率處於低檔。高點：RSI 超買、乖離過大（高於 200 日線 15%）、KD 高檔、突破布林上軌、價創高但 RSI 背離、融資維持率處於高檔。單一指標容易鈍化，所以只在「同時成立 ≥${p.threshold} 項」時才算警示，且兩次同類事件至少間隔 ${p.cooldown} 個交易日。</p>

  <ul>
  <li><b>存活者偏差</b>：股票池是「現在」的大型股名單，等於事後挑出活到今天的強者，回測績效會偏高。真實操作無法事先知道誰會存活。</li>
  <li><b>訊號樣本少</b>：15 年只有數十次事件，且常群聚在同一波行情，統計力有限。請以樣本外與基準對照判讀，不要只看漂亮的勝率。</li>
  <li><b>資料窺探</b>：指標門檻採通用慣例值、未最佳化，但設計流程難免受「看過歷史」影響。唯一可靠的檢驗是未來的實盤／紙上交易。</li>
  <li><b>交易可行性</b>：未模擬漲跌停無法成交、大額衝擊成本、融資券限制；個股以收盤價成交為假設。</li>
  <li><b>資料品質</b>：Yahoo 與 FinMind 為免費來源，可能有缺漏或錯誤，股利還原可能與實際不同。</li>
  <li><b>市場結構改變</b>：過去有效的規律不保證延續（例如 2020 年後散戶與 ETF 資金結構的改變）。</li>
  </ul>
  <h2>如何使用比較安全？</h2>
  <ul><li>把大盤訊號當成「風險儀表板」：決定分批加碼或減碼的節奏，而非全進全出。</li>
  <li>個股清單當成「研究起點」：再看基本面、產業與自己的風險承受度。單一個股建議不超過資金的 10%。</li>
  <li>先以小額或紙上交易追蹤 6~12 個月，確認與回測的落差。</li></ul>

  </div>`;
}
